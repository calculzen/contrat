<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Outils Contrat — CCN 2098 (Prestataires de services secteur tertiaire)</title>
<style>
  :root{
    --bleu:#1f3864; --bleu-clair:#2e5395; --gris:#595959; --fond:#f4f6f9;
    --alerte:#b7472a; --alerte-fond:#fdedec; --ok:#1e6b3a; --ok-fond:#eaf6ee;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif; margin:0; background:var(--fond); color:#222;}
  header{background:var(--bleu); color:#fff; padding:18px 24px;}
  header h1{margin:0; font-size:20px;}
  header p{margin:4px 0 0; font-size:13px; color:#cdd7ea;}
  .tabs{display:flex; background:#fff; border-bottom:2px solid var(--bleu-clair); flex-wrap:wrap;}
  .tab{padding:12px 20px; cursor:pointer; font-size:14px; color:var(--gris); border-bottom:3px solid transparent;}
  .tab.active{color:var(--bleu); font-weight:600; border-bottom:3px solid var(--bleu);}
  .panel{display:none; padding:24px; max-width:820px; margin:0 auto;}
  .panel.active{display:block;}
  .card{background:#fff; border-radius:8px; padding:20px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:4px; margin-top:12px; color:var(--bleu);}
  input[type=number], input[type=date], select{
    width:100%; padding:8px; border:1px solid #ccc; border-radius:5px; font-size:14px;
  }
  .row{display:flex; gap:16px;}
  .row > div{flex:1;}
  .result{background:var(--fond); border-left:4px solid var(--bleu); padding:14px 16px; margin-top:16px; border-radius:4px; font-size:14px;}
  .result strong{color:var(--bleu);}
  .alerte{background:var(--alerte-fond); border-left:4px solid var(--alerte); padding:12px 14px; margin-top:12px; border-radius:4px; font-size:13px; color:#702b1e;}
  .ok{background:var(--ok-fond); border-left:4px solid var(--ok); padding:12px 14px; margin-top:12px; border-radius:4px; font-size:13px; color:var(--ok);}
  .verif{background:#fff8e1; border-left:4px solid #c9962b; padding:10px 14px; margin-top:12px; border-radius:4px; font-size:12.5px; color:#6b4e00;}
  .ref{font-size:11.5px; color:var(--gris); margin-top:6px;}
  .footer-note{font-size:11.5px; color:var(--gris); margin-top:24px; border-top:1px solid #ddd; padding-top:10px;}
  button{background:var(--bleu); color:#fff; border:none; padding:10px 18px; border-radius:5px; font-size:14px; cursor:pointer; margin-top:16px;}
  button:hover{background:var(--bleu-clair);}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  th,td{border:1px solid #ddd; padding:6px 8px; text-align:left;}
  th{background:var(--fond); color:var(--bleu);}
</style>
</head>
<body>

<header>
  <h1>Outils Contrat — Zenitude Groupe</h1>
  <p>Convention collective nationale des prestataires de services dans le domaine du secteur tertiaire — IDCC 2098</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="salaire">Salaire mensuel</div>
  <div class="tab" data-tab="carence">Délai de carence CDD</div>
  <div class="tab" data-tab="essai">Période d'essai &amp; prévenance</div>
</div>

<!-- ============ ONGLET SALAIRE ============ -->
<div class="panel active" id="panel-salaire">
  <div class="card">
    <label for="heuresHebdo">Heures hebdomadaires</label>
    <input type="number" id="heuresHebdo" step="0.01" placeholder="ex: 35">
    <div style="margin-top:8px;">
      <button type="button" onclick="remplirHeuresHebdo(35)" style="margin-top:0; margin-right:8px; padding:6px 14px; font-size:13px;">35h</button>
      <button type="button" onclick="remplirHeuresHebdo(39)" style="margin-top:0; padding:6px 14px; font-size:13px;">39h</button>
    </div>

    <div class="result" id="resHeuresMensuelles" style="display:none;"></div>

    <label for="tauxHoraire">Taux horaire brut (€)</label>
    <input type="number" id="tauxHoraire" step="0.01" placeholder="ex: 12.50">

    <div class="result" id="resSalaire" style="display:none;"></div>

    <button type="button" onclick="reinitialiserSalaire()" style="background:#8a8f98;">Réinitialiser</button>
  </div>
</div>

<!-- ============ ONGLET CARENCE ============ -->
<div class="panel" id="panel-carence">
  <div class="card">
    <div class="row">
      <div>
        <label for="dateDebutCdd">Date de début du CDD écoulé</label>
        <input type="date" id="dateDebutCdd">
      </div>
      <div>
        <label for="dateFinCdd">Date de fin du CDD écoulé (renouvellement inclus)</label>
        <input type="date" id="dateFinCdd">
      </div>
    </div>

    <div class="result" id="resDureeCddCalculee" style="display:none;"></div>

    <label for="motifCdd1">Motif du CDD écoulé</label>
    <select id="motifCdd1">
      <option value="" selected>Choisissez le motif du CDD écoulé</option>
      <option value="accroissement">Accroissement temporaire d'activité</option>
      <option value="remplacement">Remplacement</option>
    </select>

    <label>
      <input type="checkbox" id="posteDifferent" style="width:auto; margin-right:6px;">
      Le nouveau contrat porte sur un poste différent
    </label>

    <div id="motifCdd2Wrap" style="display:none;">
      <label for="motifCdd2">Motif du nouveau contrat (poste différent)</label>
      <select id="motifCdd2">
        <option value="accroissement">Accroissement temporaire d'activité</option>
        <option value="remplacement">Remplacement</option>
      </select>
    </div>

    <button onclick="calculerEtAfficherCarence()">Calculer</button>
    <button type="button" onclick="reinitialiserCarence()" style="background:#8a8f98;">Réinitialiser</button>

    <div id="resCarence"></div>
  </div>
</div>

<!-- ============ ONGLET PERIODE D'ESSAI ============ -->
<div class="panel" id="panel-essai">
  <div class="card">
    <label>Type de contrat</label>
    <div style="display:flex; gap:10px; margin-bottom:4px;">
      <button type="button" id="btnTypeCdi" onclick="choisirTypeContrat('cdi')"
        style="flex:1; margin-top:0; background:var(--bleu);">CDI</button>
      <button type="button" id="btnTypeCdd" onclick="choisirTypeContrat('cdd')"
        style="flex:1; margin-top:0; background:#c9d3e3; color:var(--bleu);">CDD</button>
    </div>

    <!-- Bloc CDI -->
    <div id="blocCdi">
      <label for="categorie">Catégorie professionnelle</label>
      <select id="categorie">
        <option value="" selected>Choisissez une catégorie professionnelle</option>
        <option value="employe_nq">Employé (non qualifié, coefficient &lt; 170)</option>
        <option value="employe_q">Employé qualifié (coefficient ≥ 170)</option>
        <option value="etam">Technicien / Agent de maîtrise</option>
        <option value="cadre">Cadre</option>
      </select>

      <div class="result" id="resDureeEssai"></div>

      <label>
        <input type="checkbox" id="renouvellement" style="width:auto; margin-right:6px;">
        Renouvellement de la période d'essai
      </label>
      <div id="resConditionsRenouvellement"></div>

      <label for="dateDebutEssai">Date de début de la période d'essai</label>
      <input type="date" id="dateDebutEssai">

      <label for="dateRupture">Date de rupture envisagée (optionnel)</label>
      <input type="date" id="dateRupture">

      <label for="auteurRupture">Rupture à l'initiative de</label>
      <select id="auteurRupture">
        <option value="employeur">L'employeur</option>
        <option value="salarie">Le salarié</option>
      </select>

      <button onclick="calculerEtAfficherEssai()">Calculer</button>
      <button type="button" onclick="reinitialiserEssaiCdi()" style="background:#8a8f98;">Réinitialiser</button>

      <div id="resEssai"></div>
    </div>

    <!-- Bloc CDD -->
    <div id="blocCdd" style="display:none;">
      <label for="termePrecis">Le CDD a-t-il un terme précis ?</label>
      <select id="termePrecis">
        <option value="oui">Oui, terme précis</option>
        <option value="non">Non, pas de terme précis</option>
      </select>

      <label for="dateDebutCddEssai" id="labelDateDebutCddEssai">Date de début du CDD</label>
      <input type="date" id="dateDebutCddEssai">

      <label for="dateFinCddEssai" id="labelDateFinCddEssai">Date de fin du CDD</label>
      <input type="date" id="dateFinCddEssai">

      <button onclick="calculerEtAfficherEssaiCdd()">Calculer</button>
      <button type="button" onclick="reinitialiserEssaiCdd()" style="background:#8a8f98;">Réinitialiser</button>

      <div id="resEssaiCdd"></div>
    </div>
  </div>
</div>

<script>
// ---------- Navigation onglets ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ---------- SALAIRE MENSUEL ----------
function heuresMensuelles(heuresHebdo){
  // Arrondi au centième, ex : 35h -> 151.67
  return Math.round((heuresHebdo * 52 / 12) * 100) / 100;
}

function majSalaire(){
  const heuresHebdo = parseFloat(document.getElementById('heuresHebdo').value);
  const taux = parseFloat(document.getElementById('tauxHoraire').value);
  const resHeures = document.getElementById('resHeuresMensuelles');
  const resSalaire = document.getElementById('resSalaire');

  if (!isNaN(heuresHebdo) && heuresHebdo > 0){
    const hMens = heuresMensuelles(heuresHebdo);
    resHeures.style.display = 'block';
    resHeures.innerHTML = `Volume horaire mensuel : <strong>${hMens.toFixed(2)} h</strong>`;
  } else {
    resHeures.style.display = 'none';
  }

  if (!isNaN(heuresHebdo) && heuresHebdo > 0 && !isNaN(taux) && taux > 0){
    const hMens = heuresMensuelles(heuresHebdo);
    const salaireMensuel = Math.round(hMens * taux * 100) / 100;
    const salaireAnnuel = Math.round(salaireMensuel * 12 * 100) / 100;
    resSalaire.style.display = 'block';
    resSalaire.innerHTML = `
      Salaire mensuel brut : <strong>${salaireMensuel.toFixed(2)} €</strong><br>
      Salaire brut annuel (mensuel × 12) : <strong>${salaireAnnuel.toFixed(2)} €</strong>
    `;
  } else {
    resSalaire.style.display = 'none';
  }
}
function remplirHeuresHebdo(valeur){
  document.getElementById('heuresHebdo').value = valeur;
  majSalaire();
}
function reinitialiserSalaire(){
  document.getElementById('heuresHebdo').value = '';
  document.getElementById('tauxHoraire').value = '';
  document.getElementById('resHeuresMensuelles').style.display = 'none';
  document.getElementById('resSalaire').style.display = 'none';
}
document.getElementById('heuresHebdo').addEventListener('input', majSalaire);
document.getElementById('tauxHoraire').addEventListener('input', majSalaire);

// ---------- DELAI DE CARENCE CDD (CCN 2098 : pas de dérogation, droit commun) ----------
document.getElementById('posteDifferent').addEventListener('change', function(){
  document.getElementById('motifCdd2Wrap').style.display = this.checked ? 'block' : 'none';
  calculerEtAfficherCarence(true);
});
document.getElementById('motifCdd1').addEventListener('change', () => calculerEtAfficherCarence(true));
document.getElementById('motifCdd2').addEventListener('change', () => calculerEtAfficherCarence(true));
document.getElementById('dateDebutCdd').addEventListener('change', () => calculerEtAfficherCarence(true));
document.getElementById('dateFinCdd').addEventListener('change', () => calculerEtAfficherCarence(true));

const MOTIFS_SANS_CARENCE = ['remplacement'];

function calculerCarence(dureeCdd, posteDifferent, motif1, motif2){
  // Retourne { delaiJours, base, exonere, politiqueInterne }
  if (!posteDifferent){
    // Même poste : règle légale stricte, pas d'exonération de motif possible ici
    const delai = dureeCdd >= 14 ? dureeCdd / 3 : dureeCdd / 2;
    return { delaiJours: Math.ceil(delai), base: 'legal', exonere: false, politiqueInterne: false };
  }

  // Poste différent : exonération si les deux contrats relèvent d'un motif d'exception (L.1244-1)
  const exonere = MOTIFS_SANS_CARENCE.includes(motif1) && MOTIFS_SANS_CARENCE.includes(motif2);
  if (exonere){
    return { delaiJours: 0, base: 'exoneration_L1244-1', exonere: true, politiqueInterne: false };
  }

  // Sinon : politique interne Zenitude, calquée sur la carence légale (non opposable comme obligation légale)
  const delai = dureeCdd >= 14 ? dureeCdd / 3 : dureeCdd / 2;
  return { delaiJours: Math.ceil(delai), base: 'politique_interne', exonere: false, politiqueInterne: true };
}

function reinitialiserCarence(){
  document.getElementById('dateDebutCdd').value = '';
  document.getElementById('dateFinCdd').value = '';
  document.getElementById('motifCdd1').value = '';
  document.getElementById('posteDifferent').checked = false;
  document.getElementById('motifCdd2Wrap').style.display = 'none';
  document.getElementById('motifCdd2').value = 'accroissement';
  document.getElementById('resDureeCddCalculee').style.display = 'none';
  document.getElementById('resCarence').innerHTML = '';
}

function calculerEtAfficherCarence(silencieux){
  const debutStr = document.getElementById('dateDebutCdd').value;
  const finStr = document.getElementById('dateFinCdd').value;
  const posteDifferent = document.getElementById('posteDifferent').checked;
  const motif1 = document.getElementById('motifCdd1').value;
  const motif2 = document.getElementById('motifCdd2').value;
  const out = document.getElementById('resCarence');
  const resDuree = document.getElementById('resDureeCddCalculee');

  if (!debutStr || !finStr){
    if (silencieux === true){ out.innerHTML = ''; resDuree.style.display = 'none'; return; }
    out.innerHTML = '<div class="alerte">Renseigne les deux dates du CDD écoulé.</div>';
    resDuree.style.display = 'none';
    return;
  }

  const dateDebut = new Date(debutStr);
  const dateFin = new Date(finStr);
  // Durée en jours calendaires, dates de début et de fin incluses
  const dureeCdd = Math.round((dateFin - dateDebut) / 86400000) + 1;

  if (dureeCdd <= 0){
    out.innerHTML = '<div class="alerte">La date de fin doit être postérieure ou égale à la date de début.</div>';
    resDuree.style.display = 'none';
    return;
  }

  resDuree.style.display = 'block';
  resDuree.innerHTML = `Durée calculée : <strong>${dureeCdd} jour(s) calendaires</strong> (dates de début et de fin incluses).`;

  if (!motif1){
    if (silencieux === true){ out.innerHTML = ''; return; }
    out.innerHTML = '<div class="alerte">Choisis le motif du CDD écoulé.</div>';
    return;
  }

  const r = calculerCarence(dureeCdd, posteDifferent, motif1, motif2);

  if (r.exonere){
    out.innerHTML = `
      <div class="ok"><strong>Aucun délai de carence.</strong><br>
      Poste différent + motif remplacement sur les deux contrats → exonération légale (art. L.1244-1 du Code du travail).</div>
    `;
  } else if (r.politiqueInterne){
    out.innerHTML = `
      <div class="result"><strong>Délai calculé : ${r.delaiJours} jour(s) d'ouverture</strong> avant nouveau contrat sur ce poste.</div>
      <div class="verif">
        Aucune obligation légale ici (poste différent, motifs non exonératoires — art. L.1244-1 inapplicable).
        Délai raisonnable retenu par Zenitude, calqué par prudence sur le calcul de carence légale, pour limiter
        le risque de requalification en cas de contentieux sur le caractère réellement différent du poste.
      </div>
    `;
  } else {
    out.innerHTML = `
      <div class="result"><strong>Délai de carence légal : ${r.delaiJours} jour(s) d'ouverture</strong>
      (${dureeCdd} j ${dureeCdd >= 14 ? '≥ 14 j → 1/3' : '< 14 j → 1/2'} de la durée du CDD).</div>
      <div class="ref">Art. L.1244-3 et L.1244-4 du Code du travail — même poste, décompte en jours d'ouverture de l'entreprise.</div>
    `;
  }
}

// ---------- PERIODE D'ESSAI & PREVENANCE (CCN 2098) ----------
// Source : LégiSocial, tableau "Cas particuliers prévus dans la convention" (màj 02/07/2026),
// distinct du tableau "Généralités" qui n'affiche que les maxima légaux de référence (2/3/4 mois).
// La CCN prévoit des durées plus courtes que le maximum légal : elles s'appliquent (plus favorables au salarié).
// Renouvellement/prévenance : uniquement documentés pour "employés qualifiés (coef ≥170)", techniciens/AM, cadres.
const BAREME_ESSAI_CDI = {
  employe_nq: { dureeMoisInitial: 1, renouvelable: false, renouvellementJours: 0, prevenanceJours: null,
    label: "Employé (non qualifié, coefficient < 170)" },
  employe_q:  { dureeMoisInitial: 1, renouvelable: true, renouvellementJours: 14, prevenanceJours: 7,
    label: "Employé qualifié (coefficient ≥ 170)" },
  etam:       { dureeMoisInitial: 2, renouvelable: true, renouvellementJours: 30, prevenanceJours: 14,
    label: "Technicien / Agent de maîtrise" },
  cadre:      { dureeMoisInitial: 3, renouvelable: true, renouvellementJours: 60, prevenanceJours: 30,
    label: "Cadre" },
};

function ajouterJours(date, jours){
  const d = new Date(date);
  d.setDate(d.getDate() + jours);
  return d;
}
function ajouterMois(date, mois){
  const d = new Date(date);
  d.setMonth(d.getMonth() + mois);
  return d;
}
function formatDate(d){
  return d.toLocaleDateString('fr-FR');
}

// Barème légal de prévenance à la rupture par l'employeur (L.1221-25) — utilisé uniquement
// en secours pour les employés non qualifiés, faute de disposition CCN identifiée pour cette catégorie.
function prevenanceEmployeurLegale(anciennetePE_jours){
  if (anciennetePE_jours < 8) return { jours: 1, label: '24 heures' };
  if (anciennetePE_jours < 30) return { jours: 2, label: '48 heures' };
  if (anciennetePE_jours < 90) return { jours: 14, label: '2 semaines' };
  return { jours: 30, label: '1 mois' };
}

// Barème légal de prévenance à la rupture par le salarié (L.1221-26).
function prevenanceSalarieLegale(anciennetePE_jours){
  if (anciennetePE_jours < 8) return { jours: 1, label: '24 heures' };
  return { jours: 2, label: '48 heures' };
}

// Bascule d'affichage CDI / CDD
function choisirTypeContrat(type){
  const cdd = type === 'cdd';
  document.getElementById('blocCdi').style.display = cdd ? 'none' : 'block';
  document.getElementById('blocCdd').style.display = cdd ? 'block' : 'none';
  document.getElementById('btnTypeCdi').style.background = cdd ? '#c9d3e3' : 'var(--bleu)';
  document.getElementById('btnTypeCdi').style.color = cdd ? 'var(--bleu)' : '#fff';
  document.getElementById('btnTypeCdd').style.background = cdd ? 'var(--bleu)' : '#c9d3e3';
  document.getElementById('btnTypeCdd').style.color = cdd ? '#fff' : 'var(--bleu)';
}

document.getElementById('termePrecis').addEventListener('change', function(){
  const precis = this.value === 'oui';
  document.getElementById('labelDateDebutCddEssai').textContent = precis
    ? 'Date de début du CDD' : 'Date de début (durée minimale prévue)';
  document.getElementById('labelDateFinCddEssai').textContent = precis
    ? 'Date de fin du CDD' : 'Date de fin (durée minimale prévue)';
  calculerEtAfficherEssaiCdd(true);
});
document.getElementById('dateDebutCddEssai').addEventListener('change', () => calculerEtAfficherEssaiCdd(true));
document.getElementById('dateFinCddEssai').addEventListener('change', () => calculerEtAfficherEssaiCdd(true));

function majDureeEssai(){
  const cat = document.getElementById('categorie').value;
  const b = BAREME_ESSAI_CDI[cat];
  const out = document.getElementById('resDureeEssai');

  if (!b){
    out.innerHTML = '';
    document.getElementById('resConditionsRenouvellement').innerHTML = '';
    document.getElementById('resEssai').innerHTML = '';
    return;
  }

  let txt = `Durée initiale CCN 2098 : <strong>${b.dureeMoisInitial} mois</strong>`;
  if (b.renouvelable){
    txt += ` — renouvelable une fois (+${b.renouvellementJours} jours) ; prévenance rupture pendant le renouvellement (art. 13.2) : ${b.prevenanceJours} jours. En phase initiale, barème légal L.1221-25/26.`;
  } else {
    txt += ` — <span style="color:#6b4e00;">renouvellement et prévenance non documentés pour cette catégorie ; barème légal appliqué par défaut pour la prévenance (voir note en bas de page).</span>`;
  }
  out.innerHTML = txt;
  majConditionsRenouvellement();
  calculerEtAfficherEssai(true);
}
document.getElementById('categorie').addEventListener('change', majDureeEssai);
document.getElementById('renouvellement').addEventListener('change', function(){
  majConditionsRenouvellement();
  calculerEtAfficherEssai(true);
});
document.getElementById('auteurRupture').addEventListener('change', () => calculerEtAfficherEssai(true));
document.getElementById('dateDebutEssai').addEventListener('change', () => calculerEtAfficherEssai(true));
document.getElementById('dateRupture').addEventListener('change', () => calculerEtAfficherEssai(true));

function majConditionsRenouvellement(){
  const cat = document.getElementById('categorie').value;
  const b = BAREME_ESSAI_CDI[cat];
  const renouvellement = document.getElementById('renouvellement').checked;
  const out = document.getElementById('resConditionsRenouvellement');
  if (!renouvellement || !b){ out.innerHTML = ''; return; }

  if (!b.renouvelable){
    out.innerHTML = `
      <div class="alerte">
        Pas de renouvellement documenté pour cette catégorie (${b.label}) dans les sources consultées.
        Le calcul ci-dessous l'ignorera.
      </div>
    `;
    return;
  }

  let html = `
    <div class="verif">
      Conditions cumulatives pour un renouvellement valable (CDI uniquement, source : code.travail.gouv.fr) :
      le contrat de travail ou la lettre d'engagement doit prévoir le renouvellement, et l'accord des deux
      parties doit être donné par écrit pendant la période d'essai initiale.
    </div>
  `;
  if (cat === 'cadre'){
    html += `
      <div class="alerte">
        <strong>Cadres : condition supplémentaire.</strong> Le renouvellement ne peut intervenir qu'après un
        entretien de cadrage justifiant sa nécessité, à tenir dans les 15 jours précédant la fin de la période
        d'essai initiale.
      </div>
    `;
  }
  out.innerHTML = html;
}

function reinitialiserEssaiCdi(){
  document.getElementById('categorie').value = '';
  document.getElementById('renouvellement').checked = false;
  document.getElementById('dateDebutEssai').value = '';
  document.getElementById('dateRupture').value = '';
  document.getElementById('auteurRupture').value = 'employeur';
  document.getElementById('resEssai').innerHTML = '';
  document.getElementById('resConditionsRenouvellement').innerHTML = '';
  majDureeEssai();
}
majDureeEssai();

function calculerEtAfficherEssai(silencieux){
  const cat = document.getElementById('categorie').value;
  const b = BAREME_ESSAI_CDI[cat];
  const renouvellement = document.getElementById('renouvellement').checked;
  const dateDebutStr = document.getElementById('dateDebutEssai').value;
  const dateRuptureStr = document.getElementById('dateRupture').value;
  const out = document.getElementById('resEssai');

  if (!b){
    if (silencieux === true){ out.innerHTML = ''; return; }
    out.innerHTML = '<div class="alerte">Choisis une catégorie professionnelle.</div>';
    return;
  }

  if (!dateDebutStr){
    if (silencieux === true){ out.innerHTML = ''; return; }
    out.innerHTML = '<div class="alerte">Renseigne la date de début de la période d\'essai.</div>';
    return;
  }

  if (renouvellement && !b.renouvelable){
    out.innerHTML = `<div class="alerte">Pas de renouvellement documenté pour cette catégorie dans les sources consultées — vérifie le texte conventionnel avant d'en appliquer un.</div>`;
    return;
  }

  const dateDebut = new Date(dateDebutStr);
  const dateFinInitiale = ajouterMois(dateDebut, b.dureeMoisInitial);
  let dateFin = dateFinInitiale;
  let dureeTexte = `${b.dureeMoisInitial} mois`;
  if (renouvellement){
    dateFin = ajouterJours(dateFinInitiale, b.renouvellementJours);
    dureeTexte += ` + ${b.renouvellementJours} jours (renouvellement)`;
  }

  let html = `
    <div class="result">
      Catégorie : <strong>${b.label}</strong><br>
      Durée totale de la période d'essai : <strong>${dureeTexte}</strong><br>
      Terme de la période d'essai : <strong>${formatDate(dateFin)}</strong>
    </div>
    <div class="ref">
      Rappel : la prévenance est le délai à respecter pour notifier la rupture au salarié — elle ne prolonge pas
      la période d'essai, contrairement au renouvellement.
    </div>
  `;

  if (dateRuptureStr){
    const dateRupture = new Date(dateRuptureStr);
    const anciennetePE = Math.round((dateRupture - dateDebut) / 86400000);
    const ruptureEnRenouvellement = renouvellement && dateRupture > dateFinInitiale;
    const auteur = document.getElementById('auteurRupture').value;

    let prevenanceJours, sourcePrevenance;
    if (ruptureEnRenouvellement && b.prevenanceJours !== null){
      // Barème CCN 2098 (art. 13.2) : ne s'applique qu'à la rupture pendant le renouvellement.
      // La source ne distingue pas employeur/salarié — appliqué aux deux par défaut, à vérifier pour le salarié.
      prevenanceJours = b.prevenanceJours;
      sourcePrevenance = `barème CCN 2098 art. 13.2, phase renouvellement, ${auteur === 'salarie' ? 'salarié — non distingué par la source, à vérifier' : 'employeur'} (${b.prevenanceJours} jours)`;
    } else if (auteur === 'salarie'){
      // Rupture par le salarié en phase initiale : barème légal L.1221-26 (48h, ou 24h si <8j de présence).
      const pl = prevenanceSalarieLegale(anciennetePE);
      prevenanceJours = pl.jours;
      sourcePrevenance = `barème légal L.1221-26, salarié, phase initiale (${pl.label})`;
    } else {
      // Rupture par l'employeur en phase initiale : le texte de 1999 ("sans préavis ni indemnité") est obsolète
      // depuis la loi de 2008 ; le barème légal L.1221-25 s'applique, pour toutes les catégories.
      const pl = prevenanceEmployeurLegale(anciennetePE);
      prevenanceJours = pl.jours;
      sourcePrevenance = `barème légal L.1221-25, employeur, phase initiale (${pl.label})`;
    }

    const dateNotificationLimite = ajouterJours(dateRupture, -prevenanceJours);
    const ruptureApresTerme = dateRupture > dateFin;
    const notificationAvantDebut = dateNotificationLimite < dateDebut;

    html += `
      <div class="result">
        Délai de prévenance (${auteur === 'salarie' ? 'salarié' : 'employeur'}) applicable : <strong>${prevenanceJours} jour(s)</strong> (${sourcePrevenance})<br>
        Pour rompre à la date du ${formatDate(dateRupture)}, il faut notifier la rupture
        au plus tard le <strong>${formatDate(dateNotificationLimite)}</strong>.
      </div>
    `;

    if (ruptureApresTerme){
      const joursDepassement = Math.round((dateRupture - dateFin) / 86400000);
      html += `
        <div class="alerte">
          <strong>Alerte : la date de rupture envisagée (${formatDate(dateRupture)}) est postérieure au terme
          de la période d'essai (${formatDate(dateFin)})</strong> — dépassement de ${joursDepassement} jour(s).
          Au-delà du terme, ce n'est plus une rupture de période d'essai (le contrat s'est normalement poursuivi
          en CDI) ; le régime de rupture applicable est différent (démission, licenciement, etc. selon le cas).
        </div>
      `;
    } else if (notificationAvantDebut){
      const joursManquants = Math.round((dateDebut - dateNotificationLimite) / 86400000);
      html += `
        <div class="alerte">
          <strong>Alerte : délai de prévenance impossible à respecter intégralement.</strong>
          Pour rompre le ${formatDate(dateRupture)} en respectant ${prevenanceJours} jour(s) de prévenance,
          il aurait fallu notifier ${joursManquants} jour(s) avant le début de la période d'essai. En pratique,
          notifier dès le début de l'essai décale la date d'effet à ${formatDate(ajouterJours(dateDebut, prevenanceJours))},
          ${dateRupture < ajouterJours(dateDebut, prevenanceJours) ? 'plus tard que la date envisagée' : ''}.
        </div>
      `;
    } else {
      html += `<div class="ok">Le délai de prévenance et la date de rupture envisagée sont compatibles avec le terme de la période d'essai.</div>`;
    }
  }

  out.innerHTML = html;
}

// ---------- PERIODE D'ESSAI CDD (droit commun, art. L.1242-10) ----------
// Règle confirmée : durée du CDD ≤ 6 mois inclus → 1 jour/semaine plafonné à 14 jours.
// Durée du CDD > 6 mois → 1 mois maximum.
function dureeEssaiCdd(dateDebut, dateFin){
  const dureeJoursTotale = Math.round((dateFin - dateDebut) / 86400000) + 1;
  const sixMois = ajouterMois(dateDebut, 6);
  const sixMoisInclus = dateFin <= sixMois;
  const joursBruts = Math.ceil(dureeJoursTotale / 7);

  if (sixMoisInclus){
    return { jours: Math.min(joursBruts, 14), cap: '2 semaines', dureeJoursTotale, sixMoisInclus };
  }
  return { jours: 30, cap: '1 mois', dureeJoursTotale, sixMoisInclus };
}

function reinitialiserEssaiCdd(){
  document.getElementById('termePrecis').value = 'oui';
  document.getElementById('labelDateDebutCddEssai').textContent = 'Date de début du CDD';
  document.getElementById('labelDateFinCddEssai').textContent = 'Date de fin du CDD';
  document.getElementById('dateDebutCddEssai').value = '';
  document.getElementById('dateFinCddEssai').value = '';
  document.getElementById('resEssaiCdd').innerHTML = '';
}

function calculerEtAfficherEssaiCdd(silencieux){
  const debutStr = document.getElementById('dateDebutCddEssai').value;
  const finStr = document.getElementById('dateFinCddEssai').value;
  const termePrecis = document.getElementById('termePrecis').value === 'oui';
  const out = document.getElementById('resEssaiCdd');

  if (!debutStr || !finStr){
    if (silencieux === true){ out.innerHTML = ''; return; }
    out.innerHTML = '<div class="alerte">Renseigne les deux dates.</div>';
    return;
  }

  const dateDebut = new Date(debutStr);
  const dateFin = new Date(finStr);

  if (dateFin < dateDebut){
    out.innerHTML = '<div class="alerte">La date de fin doit être postérieure ou égale à la date de début.</div>';
    return;
  }

  const r = dureeEssaiCdd(dateDebut, dateFin);

  out.innerHTML = `
    <div class="result">
      Durée maximale de la période d'essai : <strong>${r.jours} jour(s)</strong> (plafond : ${r.cap})<br>
      Base : ${termePrecis ? 'durée totale du CDD' : "durée minimale prévue par le contrat"} = ${r.dureeJoursTotale} jour(s)
      (${r.sixMoisInclus ? '≤ 6 mois inclus' : '> 6 mois'}).
    </div>
    <div class="ref">Art. L.1242-10 du Code du travail — aucune dérogation CCN 2098 identifiée.</div>
  `;
}
